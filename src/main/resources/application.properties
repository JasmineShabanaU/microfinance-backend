spring.application.name=microfinance

server.port=8080

# Persistent H2 database in PostgreSQL mode for zero-configuration, reliable execution
spring.datasource.url=jdbc:mysql://localhost:3306/microfinance_db?createDatabaseIfNotExist=true

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=jas@2006

spring.jpa.hibernate.ddl-auto=update

# Flyway manages the SRS feature-expansion tables. Existing databases are baselined.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security & JWT Configuration (SRS Appendix D.1)
app.jwt.secret=RuralMicrofinanceSecretKeySuperSecureHS512AlgorithmCompliantSigningKey2026RequirementSRS15
app.jwt.access-token-expiration=3600
app.jwt.refresh-token-expiration=86400